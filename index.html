<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เช็คลิสต์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f7;
    --surface: #ffffff;
    --ink: #14182b;
    --muted: #6b7280;
    --border: #e3e7f0;
    --accent: #2451b8;
    --accent-dark: #1b3e94;
    --accent-soft: #eaf0ff;
    --danger: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding-bottom: 60px;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }

  .user-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-name {
    font-size: 13.5px;
    color: var(--muted);
    font-weight: 500;
  }
  .logout-btn {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
  }
  .logout-btn:hover { background: #dde7ff; }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 0;
  }

  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14.5px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 8px 20px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
    margin-bottom: 20px;
  }

  .item-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .item-row:last-child { border-bottom: none; }
  .item-name {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
    min-width: 0;
  }

  .segmented {
    display: flex;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    flex-shrink: 0;
  }
  .segmented input { display: none; }
  .segmented label {
    font-size: 13.5px;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 7px;
    cursor: pointer;
    color: var(--muted);
    transition: background .15s, color .15s;
    user-select: none;
  }
  .segmented input:checked + label.has-label {
    color: #fff;
  }
  .segmented .opt-yes input:checked + label { background: var(--success); color: #fff; }
  .segmented .opt-no input:checked + label { background: var(--danger); color: #fff; }

  button.submit-btn {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    padding: 13px 26px;
    border-radius: 11px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  button.submit-btn:hover { background: var(--accent-dark); }
  button.submit-btn:active { transform: scale(0.99); }
  button.submit-btn:disabled { opacity: 0.55; cursor: default; }

  #status {
    font-size: 13.5px;
    margin-top: 12px;
    min-height: 18px;
    font-weight: 500;
    text-align: center;
  }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--success); }

  #empty {
    color: var(--muted);
    font-size: 14.5px;
    text-align: center;
    padding: 24px 0;
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 12.5l2 2 4-4.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="4" y="4" width="16" height="16" rx="4" stroke="white" stroke-width="1.6"/>
        </svg>
      </div>
      <span class="brand-name">เช็คลิสต์</span>
    </div>
    <div class="user-area">
      <span class="user-name" id="userLabel"></span>
      <a href="#" class="logout-btn" id="logoutLink">ออกจากระบบ</a>
    </div>
  </div>
</header>

<main>
  <h1>รายการเช็คลิสต์</h1>
  <p class="sub">เลือกสถานะ "มี" หรือ "ไม่มี" ให้ครบทุกรายการ แล้วกดบันทึก</p>

  <div class="card" id="itemsCard">
    <p id="empty">กำลังโหลดรายการ...</p>
  </div>

  <button class="submit-btn" id="submitBtn" style="display:none;">บันทึกข้อมูล</button>
  <div id="status"></div>
</main>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxzdtvXpqqS1hNOXh6a5m2JxLi3B6t3bWoa64dz1uOFeNZCllyj8nkC8oChzduIbSrpRA/exec';

  // ยิง fetch พร้อม retry อัตโนมัติถ้า Apps Script ตอบกลับเป็น HTML แทน JSON
  // (เกิดจาก cold start ของ Apps Script บางครั้ง ไม่ใช่ error จริง)
  async function fetchJson(url, options, attempt) {
    if (attempt === undefined) attempt = 0;
    const delays = [0, 1000, 2500];
    if (delays[attempt] > 0) {
      await new Promise(function (r) { setTimeout(r, delays[attempt]); });
    }
    const res = await fetch(url, options);
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (err) {
      if (attempt < delays.length - 1) {
        return fetchJson(url, options, attempt + 1);
      }
      throw new Error('เซิร์ฟเวอร์ Apps Script ตอบสนองช้าผิดปกติ กรุณาลองบันทึกอีกครั้ง');
    }
  }

  const userRaw = sessionStorage.getItem('user');
  if (!userRaw) {
    window.location.href = 'login.html';
  }
  const currentUser = JSON.parse(userRaw || '{}');
  document.getElementById('userLabel').textContent =
    (currentUser.name || '') + ' ' + (currentUser.surname || '');

  document.getElementById('logoutLink').addEventListener('click', function (e) {
    e.preventDefault();
    sessionStorage.removeItem('user');
    window.location.href = 'login.html';
  });

  const itemsCard = document.getElementById('itemsCard');
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadItems() {
    try {
      const json = await fetchJson(API_URL + '?action=getChecklistItems');
      if (!json.success) throw new Error(json.error || 'โหลดรายการไม่สำเร็จ');

      if (!json.items.length) {
        itemsCard.innerHTML = '<p id="empty">ไม่มีรายการให้เช็คในขณะนี้</p>';
        return;
      }

      itemsCard.innerHTML = json.items.map(function (item, idx) {
        const groupName = 'item_' + idx;
        return '<div class="item-row" data-item="' + escapeHtml(item) + '">' +
          '<span class="item-name">' + escapeHtml(item) + '</span>' +
          '<div class="segmented">' +
            '<span class="opt-yes"><input type="radio" name="' + groupName + '" id="' + groupName + '_yes" value="มี" required>' +
              '<label for="' + groupName + '_yes">มี</label></span>' +
            '<span class="opt-no"><input type="radio" name="' + groupName + '" id="' + groupName + '_no" value="ไม่มี">' +
              '<label for="' + groupName + '_no">ไม่มี</label></span>' +
          '</div>' +
        '</div>';
      }).join('');

      submitBtn.style.display = 'block';
    } catch (err) {
      itemsCard.innerHTML = '<p id="empty">โหลดรายการไม่สำเร็จ: ' + escapeHtml(err.message) + '</p>';
    }
  }

  submitBtn.addEventListener('click', async function () {
    const rows = itemsCard.querySelectorAll('.item-row');
    const items = [];
    let allAnswered = true;

    rows.forEach(function (row) {
      const itemName = row.getAttribute('data-item');
      const checked = row.querySelector('input[type="radio"]:checked');
      if (!checked) {
        allAnswered = false;
        return;
      }
      items.push({ name: itemName, status: checked.value });
    });

    if (!allAnswered) {
      statusEl.textContent = 'กรุณาเลือกสถานะให้ครบทุกรายการ';
      statusEl.className = 'error';
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'กำลังบันทึก...';
    statusEl.className = '';

    try {
      const json = await fetchJson(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'submitChecklist',
          userId: currentUser.id,
          name: currentUser.name,
          surname: currentUser.surname,
          department: currentUser.department,
          items: items
        })
      });
      if (!json.success) throw new Error(json.error || 'บันทึกไม่สำเร็จ');

      statusEl.textContent = 'บันทึกเรียบร้อย';
      statusEl.className = 'ok';
    } catch (err) {
      statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      statusEl.className = 'error';
    } finally {
      submitBtn.disabled = false;
    }
  });

  loadItems();
</script>
</body>
</html>
