<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดข้อความ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f7;
    --surface: #ffffff;
    --ink: #14182b;
    --muted: #6b7280;
    --border: #e3e7f0;
    --accent: #2451b8;
    --accent-dark: #1b3e94;
    --accent-soft: #eaf0ff;
    --danger: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding-bottom: 60px;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }

  .user-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-name {
    font-size: 13.5px;
    color: var(--muted);
    font-weight: 500;
  }
  .logout-btn {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s;
  }
  .logout-btn:hover { background: #dde7ff; }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 0;
  }

  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14.5px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
    margin-bottom: 28px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 18px;
  }

  label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 7px;
  }
  .field { margin-bottom: 16px; }
  input, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 11px;
    padding: 11px 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
    resize: vertical;
  }
  textarea { min-height: 84px; }
  input:focus, textarea:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  button {
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    padding: 11px 22px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: scale(0.99); }
  button:disabled { opacity: 0.55; cursor: default; }

  #status {
    font-size: 13.5px;
    margin-top: 12px;
    min-height: 18px;
    font-weight: 500;
  }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--success); }

  .list-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 10px;
    display: flex;
    gap: 14px;
  }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
  }
  .entry-body { min-width: 0; flex: 1; }
  .entry-meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
  }
  .entry-meta .name { font-weight: 700; font-size: 14.5px; }
  .entry-meta .time { font-size: 12.5px; color: var(--muted); }
  .entry-message {
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #empty {
    color: var(--muted);
    font-size: 14.5px;
    text-align: center;
    padding: 32px 0;
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5.5C4 4.67 4.67 4 5.5 4h9L20 8.5V18.5c0 .83-.67 1.5-1.5 1.5h-13C4.67 20 4 19.33 4 18.5v-13Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M8 10.5h8M8 14h5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">สมุดข้อความ</span>
    </div>
    <div class="user-area">
      <span class="user-name" id="userLabel"></span>
      <a href="#" class="logout-btn" id="logoutLink">ออกจากระบบ</a>
    </div>
  </div>
</header>

<main>
  <h1>ฝากข้อความ</h1>
  <p class="sub">ข้อความทั้งหมดถูกเก็บใน Google Sheet</p>

  <div class="card">
    <p class="card-title">เขียนข้อความใหม่</p>
    <form id="noteForm">
      <div class="field">
        <label for="name">ชื่อ</label>
        <input id="name" type="text" required maxlength="60">
      </div>
      <div class="field">
        <label for="message">ข้อความ</label>
        <textarea id="message" required maxlength="500"></textarea>
      </div>
      <button type="submit" id="submitBtn">บันทึก</button>
      <div id="status"></div>
    </form>
  </div>

  <p class="list-title">ข้อความล่าสุด</p>
  <div id="list">
    <p id="empty">กำลังโหลดข้อความ...</p>
  </div>
</main>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxzdtvXpqqS1hNOXh6a5m2JxLi3B6t3bWoa64dz1uOFeNZCllyj8nkC8oChzduIbSrpRA/exec';

  const userRaw = sessionStorage.getItem('user');
  if (!userRaw) {
    window.location.href = 'login.html';
  }
  const currentUser = JSON.parse(userRaw || '{}');
  document.getElementById('userLabel').textContent =
    (currentUser.name || '') + ' ' + (currentUser.surname || '');

  document.getElementById('logoutLink').addEventListener('click', function (e) {
    e.preventDefault();
    sessionStorage.removeItem('user');
    window.location.href = 'login.html';
  });

  const form = document.getElementById('noteForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const listEl = document.getElementById('list');

  const avatarColors = ['#2451b8', '#0f766e', '#b45309', '#6d28d9', '#be123c', '#15803d'];
  function colorFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
    return avatarColors[Math.abs(h) % avatarColors.length];
  }
  function initials(name) {
    const trimmed = (name || '').trim();
    return trimmed ? trimmed.charAt(0).toUpperCase() : '?';
  }

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadNotes() {
    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'โหลดข้อมูลไม่สำเร็จ');

      if (!json.data.length) {
        listEl.innerHTML = '<p id="empty">ยังไม่มีข้อความ เป็นคนแรกที่ฝากข้อความสิ</p>';
        return;
      }

      listEl.innerHTML = json.data.map(function (item) {
        return '<div class="entry">' +
          '<div class="avatar" style="background:' + colorFor(item.name) + '">' + escapeHtml(initials(item.name)) + '</div>' +
          '<div class="entry-body">' +
            '<div class="entry-meta"><span class="name">' + escapeHtml(item.name) + '</span><span class="time">' + formatDate(item.timestamp) + '</span></div>' +
            '<div class="entry-message">' + escapeHtml(item.message) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    } catch (err) {
      listEl.innerHTML = '<p id="empty">โหลดข้อความไม่สำเร็จ: ' + escapeHtml(err.message) + '</p>';
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const message = document.getElementById('message').value.trim();
    if (!name || !message) return;

    submitBtn.disabled = true;
    statusEl.textContent = 'กำลังบันทึก...';
    statusEl.className = '';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'addNote', name: name, message: message })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'บันทึกไม่สำเร็จ');

      statusEl.textContent = 'บันทึกเรียบร้อย';
      statusEl.className = 'ok';
      form.reset();
      loadNotes();
    } catch (err) {
      statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      statusEl.className = 'error';
    } finally {
      submitBtn.disabled = false;
    }
  });

  loadNotes();
</script>
</body>
</html>
