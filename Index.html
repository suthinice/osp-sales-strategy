<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมุดข้อความ</title>
<style>
  :root {
    --ink: #2b2825;
    --paper: #faf7f2;
    --line: #d8d2c6;
    --accent: #5b6f5b;
    --accent-dark: #46583f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Georgia", "Noto Serif Thai", serif;
    line-height: 1.6;
    padding: 48px 20px 80px;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-size: 28px;
    font-weight: 400;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  p.sub {
    margin: 0 0 40px;
    color: #6b6459;
    font-size: 15px;
  }
  form {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 28px 0;
    margin-bottom: 40px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #6b6459;
    margin-bottom: 6px;
  }
  input, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 2px;
    margin-bottom: 22px;
    outline: none;
  }
  input:focus, textarea:focus {
    border-bottom-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 70px;
  }
  button {
    font-family: inherit;
    font-size: 15px;
    color: var(--paper);
    background: var(--accent);
    border: none;
    padding: 11px 26px;
    cursor: pointer;
    border-radius: 2px;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.5; cursor: default; }

  #status {
    font-size: 14px;
    margin-top: 12px;
    min-height: 20px;
  }
  #status.error { color: #a44; }
  #status.ok { color: var(--accent-dark); }

  .entry {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .entry:last-child { border-bottom: none; }
  .entry-meta {
    font-size: 13px;
    color: #8a8375;
    margin-bottom: 4px;
  }
  .entry-meta .name { color: var(--ink); font-weight: 600; }
  .entry-message {
    font-size: 16px;
    white-space: pre-wrap;
  }
  #empty {
    color: #8a8375;
    font-size: 15px;
    font-style: italic;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .topbar span {
    font-size: 14px;
    color: #6b6459;
  }
  .topbar a {
    font-size: 14px;
    color: var(--accent-dark);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  .topbar a:hover { border-bottom-color: var(--accent-dark); }
</style>
</head>
<body>
<main>
  <div class="topbar">
    <span id="userLabel"></span>
    <a href="#" id="logoutLink">ออกจากระบบ</a>
  </div>
  <h1>สมุดข้อความ</h1>
  <p class="sub">ฝากข้อความไว้ที่นี่ ข้อมูลถูกเก็บใน Google Sheet</p>

  <form id="noteForm">
    <label for="name">ชื่อ</label>
    <input id="name" type="text" required maxlength="60">

    <label for="message">ข้อความ</label>
    <textarea id="message" required maxlength="500"></textarea>

    <button type="submit" id="submitBtn">บันทึก</button>
    <div id="status"></div>
  </form>

  <div id="list">
    <p id="empty">กำลังโหลดข้อความ...</p>
  </div>
</main>

<script>
  // แก้ URL นี้เป็น Web app URL ที่ได้จากการ Deploy Apps Script
  const API_URL = 'https://script.google.com/macros/s/AKfycbxzdtvXpqqS1hNOXh6a5m2JxLi3B6t3bWoa64dz1uOFeNZCllyj8nkC8oChzduIbSrpRA/exec';

  // เช็คว่า login แล้วหรือยัง ถ้ายังให้เด้งไปหน้า login
  const userRaw = sessionStorage.getItem('user');
  if (!userRaw) {
    window.location.href = 'login.html';
  }
  const currentUser = JSON.parse(userRaw || '{}');
  document.getElementById('userLabel').textContent =
    'สวัสดี ' + (currentUser.name || '') + ' ' + (currentUser.surname || '');

  document.getElementById('logoutLink').addEventListener('click', function (e) {
    e.preventDefault();
    sessionStorage.removeItem('user');
    window.location.href = 'login.html';
  });

  const form = document.getElementById('noteForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const listEl = document.getElementById('list');

  function formatDate(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function loadNotes() {
    try {
      const res = await fetch(API_URL);
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'โหลดข้อมูลไม่สำเร็จ');

      if (!json.data.length) {
        listEl.innerHTML = '<p id="empty">ยังไม่มีข้อความ เป็นคนแรกที่ฝากข้อความสิ</p>';
        return;
      }

      listEl.innerHTML = json.data.map(function (item) {
        return '<div class="entry">' +
          '<div class="entry-meta"><span class="name">' + escapeHtml(item.name) + '</span> · ' + formatDate(item.timestamp) + '</div>' +
          '<div class="entry-message">' + escapeHtml(item.message) + '</div>' +
          '</div>';
      }).join('');
    } catch (err) {
      listEl.innerHTML = '<p id="empty">โหลดข้อความไม่สำเร็จ: ' + escapeHtml(err.message) + '</p>';
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const message = document.getElementById('message').value.trim();
    if (!name || !message) return;

    submitBtn.disabled = true;
    statusEl.textContent = 'กำลังบันทึก...';
    statusEl.className = '';

    try {
      // ใช้ text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'addNote', name: name, message: message })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'บันทึกไม่สำเร็จ');

      statusEl.textContent = 'บันทึกเรียบร้อย';
      statusEl.className = 'ok';
      form.reset();
      loadNotes();
    } catch (err) {
      statusEl.textContent = 'เกิดข้อผิดพลาด: ' + err.message;
      statusEl.className = 'error';
    } finally {
      submitBtn.disabled = false;
    }
  });

  loadNotes();
</script>
</body>
</html>
