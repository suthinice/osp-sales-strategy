<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก</title>
<style>
  :root {
    --ink: #2b2825;
    --paper: #faf7f2;
    --line: #d8d2c6;
    --accent: #5b6f5b;
    --accent-dark: #46583f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: "Georgia", "Noto Serif Thai", serif;
    line-height: 1.6;
    padding: 40px 20px;
  }
  .card {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 26px;
    font-weight: 400;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 28px;
    color: #6b6459;
    font-size: 14px;
  }
  form {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 24px 0;
  }
  .row {
    display: flex;
    gap: 16px;
  }
  .row > div { flex: 1; }
  label {
    display: block;
    font-size: 13px;
    color: #6b6459;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 8px 2px;
    margin-bottom: 20px;
    outline: none;
  }
  input:focus { border-bottom-color: var(--accent); }
  button {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--paper);
    background: var(--accent);
    border: none;
    padding: 12px 26px;
    cursor: pointer;
    border-radius: 2px;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.5; cursor: default; }
  #status {
    font-size: 14px;
    margin-top: 16px;
    min-height: 20px;
    text-align: center;
  }
  #status.error { color: #a44; }
  #status.ok { color: var(--accent-dark); }
  .back {
    display: block;
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: var(--accent-dark);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .back:hover { border-bottom-color: var(--accent-dark); }
</style>
</head>
<body>
<div class="card">
  <h1>สมัครสมาชิก</h1>
  <p class="sub">กรอกข้อมูลเพื่อสร้างบัญชีใหม่</p>

  <form id="registerForm">
    <label for="id">ID</label>
    <input id="id" type="text" required autocomplete="username">

    <div class="row">
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="new-password">
      </div>
      <div>
        <label for="confirmPassword">ยืนยัน Password</label>
        <input id="confirmPassword" type="password" required autocomplete="new-password">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="name">ชื่อ</label>
        <input id="name" type="text" required>
      </div>
      <div>
        <label for="surname">นามสกุล</label>
        <input id="surname" type="text">
      </div>
    </div>

    <label for="lastname">ชื่อเล่น</label>
    <input id="lastname" type="text">

    <div class="row">
      <div>
        <label for="department">แผนก</label>
        <input id="department" type="text">
      </div>
      <div>
        <label for="phone">เบอร์โทร</label>
        <input id="phone" type="text">
      </div>
    </div>

    <button type="submit" id="submitBtn">สมัครสมาชิก</button>
    <div id="status"></div>
  </form>

  <a class="back" href="login.html">← กลับไปหน้าเข้าสู่ระบบ</a>
</div>

<script>
  // ใช้ URL เดียวกับหน้า login (Web app URL จาก Apps Script)
  const API_URL = 'https://script.google.com/macros/s/AKfycbxzdtvXpqqS1hNOXh6a5m2JxLi3B6t3bWoa64dz1uOFeNZCllyj8nkC8oChzduIbSrpRA/exec';

  const form = document.getElementById('registerForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const id = document.getElementById('id').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const name = document.getElementById('name').value.trim();
    const surname = document.getElementById('surname').value.trim();
    const lastname = document.getElementById('lastname').value.trim();
    const department = document.getElementById('department').value.trim();
    const phone = document.getElementById('phone').value.trim();

    if (password !== confirmPassword) {
      statusEl.textContent = 'Password และยืนยัน Password ไม่ตรงกัน';
      statusEl.className = 'error';
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'กำลังสมัครสมาชิก...';
    statusEl.className = '';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'register',
          id: id, password: password,
          name: name, surname: surname, lastname: lastname,
          department: department, phone: phone
        })
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || 'สมัครสมาชิกไม่สำเร็จ');

      statusEl.textContent = 'สมัครสมาชิกสำเร็จ กำลังไปหน้าเข้าสู่ระบบ...';
      statusEl.className = 'ok';
      setTimeout(function () {
        window.location.href = 'login.html';
      }, 1200);
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = 'error';
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
