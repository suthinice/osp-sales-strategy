<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f7;
    --surface: #ffffff;
    --ink: #14182b;
    --muted: #6b7280;
    --border: #e3e7f0;
    --accent: #2451b8;
    --accent-dark: #1b3e94;
    --accent-soft: #eaf0ff;
    --danger: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', sans-serif;
    padding: 32px 24px;
  }
  .shell { width: 100%; max-width: 460px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .brand-mark {
    width: 38px; height: 38px;
    border-radius: 11px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 20px; height: 20px; }
  .brand-name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 8px 24px rgba(16,24,40,0.04);
  }
  h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  p.sub {
    margin: 0 0 26px;
    color: var(--muted);
    font-size: 14.5px;
  }
  label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 7px;
  }
  .field { margin-bottom: 16px; }
  .row {
    display: flex;
    gap: 14px;
  }
  .row > div { flex: 1; min-width: 0; }

  input, select {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 11px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
    cursor: pointer;
  }
  input { cursor: text; }
  input:focus, select:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  button {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    padding: 13px 26px;
    border-radius: 11px;
    cursor: pointer;
    margin-top: 8px;
    transition: background .15s, transform .1s;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: scale(0.99); }
  button:disabled { opacity: 0.55; cursor: default; }

  #status {
    font-size: 13.5px;
    margin-top: 14px;
    min-height: 18px;
    text-align: center;
    font-weight: 500;
  }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--success); }

  .back {
    display: block;
    text-align: center;
    margin-top: 22px;
    font-size: 14px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .back:hover { color: var(--accent-dark); }
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 5.5C4 4.67 4.67 4 5.5 4h9L20 8.5V18.5c0 .83-.67 1.5-1.5 1.5h-13C4.67 20 4 19.33 4 18.5v-13Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8 10.5h8M8 14h5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="brand-name">สมุดข้อความ</span>
  </div>

  <div class="card">
    <h1>สมัครสมาชิก</h1>
    <p class="sub">กรอกข้อมูลเพื่อสร้างบัญชีใหม่</p>

    <form id="registerForm">
      <div class="field">
        <label for="id">ID</label>
        <input id="id" type="text" required autocomplete="username">
      </div>

      <div class="row">
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirmPassword">ยืนยัน Password</label>
          <input id="confirmPassword" type="password" required autocomplete="new-password">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="name">ชื่อ</label>
          <input id="name" type="text" required>
        </div>
        <div class="field">
          <label for="surname">นามสกุล</label>
          <input id="surname" type="text">
        </div>
      </div>

      <div class="field">
        <label for="lastname">ชื่อเล่น</label>
        <input id="lastname" type="text">
      </div>

      <div class="row">
        <div class="field">
          <label for="department">หน่วยงาน</label>
          <select id="department" required>
            <option value="" disabled selected>เลือกหน่วยงาน</option>
            <option value="Sales LMT">Sales LMT</option>
            <option value="PC">PC</option>
            <option value="นางฟ้าชงชิม">นางฟ้าชงชิม</option>
            <option value="ทีมกิจกรรม">ทีมกิจกรรม</option>
            <option value="Van">Van</option>
            <option value="ทวีกิจ">ทวีกิจ</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
        </div>
        <div class="field">
          <label for="phone">เบอร์โทร</label>
          <input id="phone" type="text">
        </div>
      </div>

      <button type="submit" id="submitBtn">สมัครสมาชิก</button>
      <div id="status"></div>
    </form>

    <a class="back" href="login.html">← กลับไปหน้าเข้าสู่ระบบ</a>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxzdtvXpqqS1hNOXh6a5m2JxLi3B6t3bWoa64dz1uOFeNZCllyj8nkC8oChzduIbSrpRA/exec';

  // ยิง fetch พร้อม retry อัตโนมัติถ้า Apps Script ตอบกลับเป็น HTML แทน JSON
  // (เกิดจาก cold start ของ Apps Script บางครั้ง ไม่ใช่ error จริง)
  async function fetchJson(url, options, attempt) {
    if (attempt === undefined) attempt = 0;
    const delays = [0, 1000, 2500]; // รอมากขึ้นเรื่อยๆ ในแต่ละรอบที่ลองใหม่ (รวม 3 ครั้ง)
    if (delays[attempt] > 0) {
      await new Promise(function (r) { setTimeout(r, delays[attempt]); });
    }
    const res = await fetch(url, options);
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (err) {
      if (attempt < delays.length - 1) {
        return fetchJson(url, options, attempt + 1);
      }
      throw new Error('เซิร์ฟเวอร์ Apps Script ตอบสนองช้าผิดปกติ กรุณาลองบันทึกอีกครั้ง');
    }
  }


  const form = document.getElementById('registerForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const id = document.getElementById('id').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const name = document.getElementById('name').value.trim();
    const surname = document.getElementById('surname').value.trim();
    const lastname = document.getElementById('lastname').value.trim();
    const department = document.getElementById('department').value;
    const phone = document.getElementById('phone').value.trim();

    if (password !== confirmPassword) {
      statusEl.textContent = 'Password และยืนยัน Password ไม่ตรงกัน';
      statusEl.className = 'error';
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'กำลังสมัครสมาชิก...';
    statusEl.className = '';

    try {
      const json = await fetchJson(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'register',
          id: id, password: password,
          name: name, surname: surname, lastname: lastname,
          department: department, phone: phone
        })
      });
      if (!json.success) throw new Error(json.error || 'สมัครสมาชิกไม่สำเร็จ');

      statusEl.textContent = 'สมัครสมาชิกสำเร็จ กำลังไปหน้าเข้าสู่ระบบ...';
      statusEl.className = 'ok';
      setTimeout(function () {
        window.location.href = 'login.html';
      }, 1200);
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.className = 'error';
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
